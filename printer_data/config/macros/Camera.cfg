# The 3DO V2 DSP in this printer does not expose its LED as a V4L2 control.
# Its two LEDs instead follow whether Crowsnest has the camera stream open.

[gcode_shell_command camera_stream_start]
command: /usr/bin/curl --silent --show-error --request POST http://127.0.0.1:7125/machine/services/start?service=crowsnest
timeout: 10
verbose: False

[gcode_shell_command camera_stream_stop]
command: /usr/bin/curl --silent --show-error --request POST http://127.0.0.1:7125/machine/services/stop?service=crowsnest
timeout: 10
verbose: False

[gcode_macro CAMERA_ON]
description: Start 3DO nozzle-camera stream and its two LEDs
gcode:
    RUN_SHELL_COMMAND CMD=camera_stream_start

[gcode_macro CAMERA_OFF]
description: Stop 3DO nozzle-camera stream and its two LEDs
gcode:
    RUN_SHELL_COMMAND CMD=camera_stream_stop

[delayed_gcode camera_off_after_startup]
initial_duration: 15
gcode:
    CAMERA_OFF
